[phases.setup]
aptPkgs = [
    "python3",
    "python3-pip",
    "python3-dev",
    "build-essential",
    "libta-lib0",
    "libta-lib-dev",
    "gcc",
    "g++",
    "cmake"
]

[phases.install]
cmds = [
    "python3 -m pip install --upgrade pip setuptools wheel",
    "python3 -m pip install --no-cache-dir numpy",
    "python3 -m pip install --no-cache-dir -r requirements.txt"
]

[start]
cmd = "python3 'ichimoku live.py'"
stopSignal = "SIGINT"